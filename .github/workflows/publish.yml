name: Publish to npm

# Se lance quand une "Release" est publiée sur GitHub, ou manuellement.
# Publication sans jeton : npm fait confiance à ce dépôt et à ce fichier
# (Trusted Publisher, réglé dans les paramètres du paquet sur npmjs.com).
# Ne pas renommer ce fichier sans mettre à jour ce réglage.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # obligatoire : identité OIDC pour npm (publication + provenance)

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # La publication sans jeton exige npm 11.5.1 ou plus récent
      - name: Mise à jour de npm
        run: npm install -g npm@latest

      - name: Installation des dépendances
        run: npm install

      - name: Compilation du nœud n8n
        run: npm run build

      - name: Publication officielle sur npm
        run: npm publish --provenance --access public
